name: Build experimental AWG 3.1 APKs for GL-MT3000 OP25

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Use the stock firmware module or test a kernel rebuild
        type: choice
        default: stock-kernel
        options:
          - stock-kernel
          - rebuild-kernel
      openwrt_commit:
        description: GL.iNet firmware source commit (40 hex digits)
        required: true
        default: '981c978eff636fc7d81f0ed17b00e2a6317c949a'
        type: string
      expected_kernel:
        description: Exact installed APK kernel version (defaults to OP25 beta2 build 1205)
        required: true
        default: '6.12.112~9469a6c8c449c47e503c05678ea1559d-r1'
        type: string
      publish_prerelease:
        description: Publish the successful stock-kernel build as an experimental GitHub prerelease
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWG_COMMIT: '86f89bce58e01cd0793b944bf8a998124fcc172f'
  AWG_MODULE_COMMIT: '63ed35de3d3f135b17e8eae0b84949e7700303be'
  AWG_TOOLS_COMMIT: 'ee0f0a9aa34ff0a0da4b3433b9512781cfe02843'
  OPENWRT_COMMIT: ${{ inputs.openwrt_commit }}
  EXPECTED_KERNEL: ${{ inputs.expected_kernel }}
  BUILD_MODE: ${{ inputs.build_mode }}
  STOCK_AWG_KMOD: '6.12.112.3.1~4569c4c-r1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate inputs and start build report
        run: |
          mkdir -p diagnostics
          printf 'Target: GL-MT3000 4.11.0-op25 (mediatek/filogic)\nBuild mode: %s\nExpected kernel APK version: %s\nOpenWrt commit: %s\n' \
            "$BUILD_MODE" "$EXPECTED_KERNEL" "$OPENWRT_COMMIT" > diagnostics/build-report.txt
          if [[ ! "$OPENWRT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Provide a full OpenWrt commit SHA.' | tee -a diagnostics/build-report.txt
            exit 1
          fi
          if [[ ! "$EXPECTED_KERNEL" =~ ^6\.12\.[0-9]+~[0-9a-f]{32}-r[0-9]+$ ]]; then
            echo 'Provide the full installed kernel APK version, including Linux release, hash and package revision.' | tee -a diagnostics/build-report.txt
            exit 1
          fi
          if [[ "$BUILD_MODE" == stock-kernel ]] &&
            [[ "$OPENWRT_COMMIT" != 981c978eff636fc7d81f0ed17b00e2a6317c949a ||
               "$EXPECTED_KERNEL" != 6.12.112~9469a6c8c449c47e503c05678ea1559d-r1 ]]; then
            echo 'The stock module and SDK are pinned to OP25 beta2 build 1205.' | tee -a diagnostics/build-report.txt
            exit 1
          fi

      - name: Checkout workflow and vendor build configuration
        uses: actions/checkout@v4
        with:
          path: meta
          persist-credentials: false

      - name: Checkout OpenWrt source
        if: inputs.build_mode == 'rebuild-kernel'
        uses: actions/checkout@v4
        with:
          repository: gl-inet/gl-openwrt
          ref: ${{ env.OPENWRT_COMMIT }}
          path: owrt
          persist-credentials: false

      - name: Checkout AWG 3.1 package recipes
        uses: actions/checkout@v4
        with:
          repository: 2Grey/awg-openwrt
          ref: ${{ env.AWG_COMMIT }}
          path: awg
          persist-credentials: false

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev \
            libelf-dev python3 python3-setuptools rsync unzip file wget curl xz-utils \
            zlib1g-dev libzstd-dev zstd subversion cmake ninja-build patch pkgconf swig time \
            fakeroot squashfs-tools
          df -h .

      - name: Set up the pinned OpenWrt userspace SDK
        if: inputs.build_mode == 'stock-kernel'
        run: |
          archive=openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          sha=1c04ac47bdfc361d6aab299eb520d570e368013dedcb8d29cf39dc7168ae642e
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/$archive"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum --check
          mkdir owrt
          tar --zstd -xf "$archive" -C owrt --strip-components=1
          rm -- "$archive"
          printf 'Userspace SDK: %s\nSDK SHA256: %s\n' "$archive" "$sha" >> diagnostics/build-report.txt

      - name: Install pinned feeds and configure target
        working-directory: owrt
        run: bash ../meta/scripts/prepare-awg31-op25.sh

      - name: Check kernel configuration ABI before compilation
        if: inputs.build_mode == 'rebuild-kernel'
        working-directory: owrt
        run: bash ../meta/scripts/check-op25-kernel.sh preflight

      - name: Build tools, toolchain and kernel
        if: inputs.build_mode == 'rebuild-kernel'
        working-directory: owrt
        run: |
          jobs=$(nproc)
          make -j"$jobs" tools/install V=s
          make -j"$jobs" toolchain/install V=s
          make -j"$jobs" target/linux/compile V=s
          bash ../meta/scripts/check-op25-kernel.sh compiled

      - name: Build or package the AmneziaWG kernel module
        working-directory: owrt
        run: |
          if [[ "$BUILD_MODE" == stock-kernel ]]; then
            bash ../meta/scripts/package-stock-awg-kmod.sh
          else
            make -j"$(nproc)" package/awg31/kmod-amneziawg/compile V=s
          fi

      - name: Compile tools and LuCI, then verify the packages
        working-directory: owrt
        run: |
          for package in amneziawg-tools luci-proto-amneziawg; do
            make -j"$(nproc)" "package/awg31/$package/compile" V=s
          done
          bash ../meta/scripts/collect-awg31-apks.sh

      - name: Summarize the build
        if: always()
        run: |
          if [[ -f diagnostics/build-report.txt ]]; then
            cat diagnostics/build-report.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload experimental APKs
        uses: actions/upload-artifact@v4
        with:
          name: awg31-mt3000-op25-experimental
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: awg31-mt3000-op25-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14

  prerelease:
    needs: build
    if: inputs.publish_prerelease && inputs.build_mode == 'stock-kernel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the APKs from this build
        uses: actions/download-artifact@v4
        with:
          name: awg31-mt3000-op25-experimental
          path: release-assets

      - name: Verify the release files
        working-directory: release-assets
        shell: bash
        run: |
          sha256sum --check --strict SHA256SUMS
          test -s build-report.txt

      - name: Publish experimental prerelease
        working-directory: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s failglob
          tag="awg31-op25-beta2-build1205-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="$RUNNER_TEMP/awg31-release-notes.md"
          cat > "$notes" <<EOF
          Experimental AmneziaWG 3.1 APKs for the **GL-MT3000** running **4.11.0-op25 beta2, build 1205**.

          The tools and LuCI APKs were compiled in this run. The kernel APK contains the stock GL.iNet module. If the stock module is already installed, keep it and install only the tools and LuCI APKs. Router runtime and GL.iNet VPN integration still need testing.

          [Build run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · [Installation guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/README.md#experimental-awg-31-packages-for-gl-mt3000-op25)
          EOF
          url=$(gh release create "$tag" \
            ./kmod-amneziawg-*.apk ./amneziawg-tools-*.apk ./luci-proto-amneziawg-*.apk \
            ./build-report.txt ./SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Experimental AWG 3.1 for GL-MT3000 OP25 beta2 build 1205' \
            --notes-file "$notes" --prerelease --latest=false)
          printf 'Experimental prerelease published at %s\n' "$url"
          printf '[Experimental prerelease](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
